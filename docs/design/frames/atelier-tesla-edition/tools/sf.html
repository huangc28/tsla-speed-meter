<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"SFR";src:url("SFNSRounded.ttf");font-weight:100 900}
html,body{margin:0;background:#000}
.c{width:1400px;height:400px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:300px;line-height:1;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
</style></head><body><script>
const q=new URLSearchParams(location.search),txt=q.get("t")||"86";
const L=[["system-ui",450,"'ss01'"],["system-ui",500,"'ss01'"],["system-ui",550,"'ss01'"],["SFR",450,"'ss01'"],["SFR",500,"'ss01'"],["SFR",550,"'ss01'"],["system-ui",500,"'ss01','ss02'"],["system-ui",500,"normal"]];
document.body.innerHTML=L.map(([f,w,ff])=>`<div class="c" style="font-family:'${f}',monospace;font-weight:${w};font-feature-settings:${ff}">${txt}</div>`).join("");
Promise.all(L.map(([f,w])=>document.fonts.load(`${w} 300px "${f}"`,txt))).then(()=>document.fonts.ready).then(()=>{document.title="ready"});
</script></body></html>
