<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
.c{width:1400px;height:400px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:300px;line-height:1;white-space:nowrap;overflow:hidden;font-family:"Hanken Grotesk",monospace}
</style></head><body><script>
const q=new URLSearchParams(location.search),txt=q.get("t")||"86",W=(q.get("w")||"480,500,520,540,560,580").split(",");
document.body.innerHTML=W.map(w=>`<div class="c" style="font-weight:${w};${q.get("css")||""}">${txt}</div>`).join("");
Promise.all(W.map(w=>document.fonts.load(`${w} 300px "Hanken Grotesk"`,txt))).then(()=>document.fonts.ready).then(()=>{document.title="ready"});
</script></body></html>
