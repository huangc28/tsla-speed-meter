<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gauge Variants</title>
<!-- visual 第六輪:速度表參考和三個方向(00-rulings L31、L32;第二段 L35–L37)。
     L35:量表區照 01 §7.4(844 寬 300×300、667 寬 280×280);L36:檔位在量表區內、數字下方;L37:A、B、C 各有自己的顏色、數字字型和質感。
     單一畫面:?screen=<ID>(給 headless Chrome 匯出 PNG);不帶參數:給老闆比較 + 各版本完整畫面 + 特寫。主要設計稿 landscape-mockups.html 這一輪不改。
     第八輪(L49–L53):老闆選了 C 和側光條;主要設計稿改用 C 重畫。這一頁只改「測速提醒」一段(側光條放到 C 上、L53 的一行字,alert-rule-C-*);A、B、現在的版本和第七輪的四個提醒都保留參考(L54)。
     第一段(360×330 特寫)的 PNG 在 gauge-variants/part1/,已取代。
     第七輪(L43–L46):車速數字改細(字重照 03 R7-01 實量選)、檔位改成數字正上方的 `P R N D` 一排(取代 L36 的檔位方塊)、▲ 放數字正下方(原檔位格)、
     加夜間最暗預設和量筆畫用的測試畫面(?screen=m-…)、「測速提醒」一段(L45)。Inter、Jost、Exo 2 用可變字重(300–700),才能用 320、340 這類中間字重。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+TC:wght@400;500;600;700&family=Jost:wght@300..700&family=Exo+2:wght@300..700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=block" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #05080e; color: #f2f5fa; font-family: "Inter", "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; }
  .ic { display: inline-flex; align-items: center; justify-content: center; color: currentColor; flex: none; }
  .ic svg { width: var(--s, 24px); height: var(--s, 24px); stroke-width: var(--sw, 2); }

  /* 圖庫 */
  .page { padding: 36px 32px 80px; max-width: 1800px; margin: 0 auto; }
  .page h1 { font-size: 22px; margin: 0 0 6px; }
  .page p.lead { margin: 0 0 18px; color: #aebcd4; font-size: 14px; line-height: 1.6; max-width: 120ch; }
  .boss { margin: 22px 0 10px; padding: 22px; border-radius: 20px; background: #0b111d; box-shadow: 0 0 0 1px #1f2a3a; }
  .boss h2 { margin: 0 0 4px; font-size: 20px; }
  .boss > p { margin: 0 0 18px; font-size: 14px; color: #aebcd4; }
  .bgrid { display: grid; grid-template-columns: repeat(2, 844px); gap: 26px 24px; }
  .bcap { margin: 0 0 8px; }
  .bcap b { display: block; font-size: 17px; }
  .bcap span { display: block; font-size: 14px; color: #aebcd4; margin-top: 2px; line-height: 1.5; }
  .group { margin-top: 40px; }
  .group h2 { font-size: 18px; margin: 0 0 4px; }
  .group .concept { font-size: 13px; color: #aebcd4; margin: 0 0 14px; max-width: 130ch; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .item .cap { font-size: 12px; color: #8a97ae; }
  .item .cap b { color: #aebcd4; font-weight: 600; }
  .frame { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 5px #11161f, 0 0 0 6px #222b38; }
  .scaled { position: relative; overflow: hidden; }
  .scaled > .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* 畫面:顏色由各版本的 --變數 決定(style 屬性帶入) */
  .screen { position: relative; overflow: hidden; background: var(--bg); color: var(--num); }
  .abs { position: absolute; }
  .screen.night .mk.ok, .screen.night .bico i b { filter: brightness(.62); }  /* 夜間:來源綠點、電量填色也調暗 */
  .chip { position: absolute; height: 28px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--sec); }
  .mk { width: 12px; height: 12px; flex: none; }
  .mk.ok { border-radius: 50%; background: #3de0a8; }
  .mk.tri { width: 14px; height: 12px; background: #f5b53c; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .set { position: absolute; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--icon); }
  /* 測速提醒(L45、L46):四個版本都在右欄上半(844 x 584–769、667 x 485–651,y 72 起),字級乘 --as(大字自查用,預設 1)。
     不用暖色、不畫路標外形、沒有距離;出現 / 消失只改透明度 ≤200 ms(這裡是靜態稿),速度表不動 */
  .al { position: absolute; display: flex; flex-direction: column; font-family: Inter, "Noto Sans TC", sans-serif; }
  .al .l1 { display: flex; align-items: center; gap: 8px; font-size: calc(15px * var(--as, 1)); line-height: calc(20px * var(--as, 1)); font-weight: 600; color: var(--sec); }
  /* 第二行用一般的行內排版:只會在說法和數字之間換行;英文大字時「Camera data」/「limit 60 km/h」也可以(R7-13),數字和單位不拆 */
  .al .l2 { display: block; line-height: calc(24px * var(--as, 1)); }
  .al .k { font-size: calc(15px * var(--as, 1)); line-height: calc(22px * var(--as, 1)); font-weight: 600; color: var(--sec); white-space: nowrap; margin-right: 6px; }
  .al:lang(en) .k { white-space: normal; }
  .al .nu { display: inline-block; white-space: nowrap; font-size: calc(15px * var(--as, 1)); font-weight: 500; color: var(--unit); }
  .al .nu b { color: var(--num); font-variant-numeric: tabular-nums; }
  /* 現在的版本:底卡 + 外框 + 相機圖示 + 兩行 */
  .al.now { padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--cardBd); gap: 3px; }
  .al.now .nu { font-weight: 600; }
  .al.now .nu b { font-size: calc(16px * var(--as, 1)); font-weight: 700; }
  /* 1 純字:沒有底卡、外框、圖示、分隔點;靠右對齊,像錶旁邊的一行註記 */
  .al.plain { align-items: flex-end; text-align: right; gap: 2px; }
  .al.plain .l1 { justify-content: flex-end; }
  .al.plain .k { margin: 0; }
  .al.plain .l2 { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; column-gap: 6px; }
  .al.plain .nu b { font-size: min(calc(22px * var(--as, 1)), 32px); font-weight: 600; }
  /* 2 側光條:左邊一條 3 寬的冷色細條(形狀記號,不是圖示欄)+ 第一行的相機圖示,沒有底卡 */
  .al.rule { padding: 1px 0 1px 13px; gap: 4px; }
  .al.rule::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--bar); }
  .al.rule .l1 { gap: 6px; }
  .al.rule .nu b { font-size: min(calc(20px * var(--as, 1)), 32px); font-weight: 600; }
  /* 3 數字欄:三行,數字自成一行當主角(仍 ≤ 車速字高的 1/4),標題和數字之間一條細線 */
  .al.stack .l1 { letter-spacing: 1px; }
  .al.stack .hr { height: 1px; background: var(--cardBd); margin: 8px 0 6px; }
  .al.stack .k { font-weight: 500; }
  .al.stack .nu { line-height: calc(32px * var(--as, 1)); }
  .al.stack .nu b { font-size: min(calc(26px * var(--as, 1)), 32px); font-weight: 600; }  /* 大字時也不超過車速三位數字高的 1/4 */
  /* 第八輪(L52、L53):老闆選的側光條,只有一行:相機圖示 +「此路段限速 60 公里」。光條和圖示用 accent.text #6FD8E2(01 §5.2 ③),圖示不能拿掉。
     一般的行內排版:放不下(667 寬、大字)時只在「此路段限速」和「60 公里」之間換行,圖示留在第一行開頭,第二行從左邊開始(不做左圖示、右兩行字) */
  .al.l53 .ln { font-size: calc(15px * var(--as, 1)); line-height: calc(26px * var(--as, 1)); font-weight: 600; color: var(--sec); }
  .al.l53 .cam { vertical-align: calc(-4px * var(--as, 1)); margin-right: 6px; }
  .al.l53 .k { white-space: nowrap; }
  .al.l53 .nu b { font-size: min(calc(20px * var(--as, 1)), 32px); font-weight: 600; }
  .batt { position: absolute; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 500; color: var(--sec); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bico { display: flex; align-items: center; }
  .bico i { display: block; width: 30px; height: 14px; border-radius: 3px; background: #16202e; box-shadow: inset 0 0 0 1px #2f3e52; overflow: hidden; }
  .bico i b { display: block; height: 100%; width: 72%; background: linear-gradient(90deg, #2bbf86, #3de0a8); }
  .bico s { display: block; width: 3px; height: 7px; border-radius: 0 2px 2px 0; background: #2f3e52; }
  .pill { position: absolute; transform: translateX(-50%); height: 26px; padding: 0 12px; border-radius: 13px; background: var(--card); border: 1px solid var(--cardBd); color: var(--sec); font-size: 13px; font-weight: 500; letter-spacing: .3px; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; }
  .trip { position: absolute; display: flex; flex-direction: column; }
  .trip .tr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--div); }
  .trip .tr:first-child { border-top: 1px solid var(--div); }
  .trip .k { font-size: calc(13px * var(--as, 1)); font-weight: 600; letter-spacing: 1px; color: var(--unit); }
  .trip .v { font-size: calc(18px * var(--as, 1)); font-weight: 600; color: var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }  /* R6-07 */
  .trip .v small { font-size: calc(12px * var(--as, 1)); font-weight: 500; color: var(--unit); margin-left: 3px; }
  .trip .note { font-size: calc(12px * var(--as, 1)); color: var(--unit); margin-top: 6px; }
  /* 胎壓一次性說明(01 §6.2、A30、R7-16):左欄捲動區第一項,不是跳出的對話框;按「知道了」後不再出現 */
  /* R7-21:左欄捲動區可以直向捲動,內容照原本高度排、不被壓縮(flex: none) */
  .scrollcol { position: absolute; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--unit) transparent; }
  .scrollcol > * { flex: none; }
  .scrollcol .trip { position: static; }
  .notice { padding: 10px 12px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--cardBd); color: var(--sec); font-size: calc(14px * var(--as, 1)); line-height: calc(20px * var(--as, 1)); font-weight: 500; overflow-wrap: anywhere; }
  .notice .ok { display: flex; align-items: center; justify-content: center; min-height: max(44px, calc(36px * var(--as, 1))); margin-top: 10px; border-radius: 10px; border: 1px solid var(--cardBd); color: var(--num); font-size: calc(15px * var(--as, 1)); font-weight: 600; }
  .tireph { position: absolute; border: 1.5px dashed var(--unit); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: var(--sec); }
  .tireph b { font-size: 15px; font-weight: 600; }
  .tireph span { font-size: 12px; color: var(--unit); line-height: 1.5; }
  .tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 9px; font-size: 12px; font-weight: 600; vertical-align: 2px; white-space: nowrap; }
  .tag.on { background: #12343a; color: #8fe6ee; box-shadow: inset 0 0 0 1px #2c5a66; }
  .tag.off { background: #161b24; color: #aebcd4; box-shadow: inset 0 0 0 1px #2f3a4a; }
  .bthumb { display: flex; gap: 14px; align-items: flex-start; margin-top: 12px; }
  .bthumb > span { font-size: 13px; color: #aebcd4; padding-top: 4px; }

  /* 胎壓面板(第七輪 L42 / L46):照 tire-icon.html 的 .panel 規則移植,只把顏色換成各版本的變數:--tbg 字底板和底色、--tpri 讀值、--tsec 標題和共用時間行、--this 變暗的舊值。
     每輪只有整數 psi 或「—」,四角、沒有引線、沒有免責;舊值 / 時間未知只暗那幾輪;共用時間行在車圖下方。尺寸由 tireGeometry() 帶進 --panel-w 等變數。
     字級都乘 --text-scale(預設 1);四角放不下時(refreshTireLayouts 實際量)整區加 .list 換成清單版,清單版寫輪位名稱(R7-14) */
  .tp { position: absolute; isolation: isolate; width: var(--panel-w); height: var(--panel-h); background: var(--tbg); overflow: hidden; --text-scale: 1; font-family: Inter, "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.5; color: var(--tpri); }
  .tp .panel-header { display: contents; }
  .tp .heading { position: absolute; top: 0; left: 0; margin: 0; font-size: calc(14px * var(--text-scale)); line-height: calc(18px * var(--text-scale)); font-weight: 600; color: var(--tsec); }
  .tp .car { position: absolute; top: var(--car-top); left: 50%; width: var(--car-w); height: var(--car-h); transform: translateX(-50%); z-index: 1; }
  .tp .car > img { display: block; width: 100%; height: 100%; }
  .tp .wheel { position: absolute; width: var(--col); z-index: 3; }
  .tp .wheel.fl, .tp .wheel.fr { bottom: var(--front-bottom); }
  .tp .wheel.rl, .tp .wheel.rr { top: var(--rear-top); }
  .tp .wheel.fl, .tp .wheel.rl { right: var(--left-right); text-align: right; }
  .tp .wheel.fr, .tp .wheel.rr { left: var(--right-left); text-align: left; }
  .tp .reading { display: block; color: var(--tpri); font-size: calc(19px * var(--text-scale)); line-height: calc(24px * var(--text-scale)); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tp .reading small { font-size: calc(12px * var(--text-scale)); line-height: calc(14px * var(--text-scale)); font-weight: 400; color: inherit; }
  .tp .wheel.dim .reading { color: var(--this); }
  .tp .position { display: none; }
  .tp .reading .ink { flex-wrap: nowrap; white-space: nowrap; }
  .tp .reading .value, .tp .reading small { flex: none; }
  /* 實色字底板(L40)只橫向補 2,不能拿掉 */
  .tp .ink { display: inline-flex; flex-wrap: wrap; align-items: baseline; column-gap: 3px; vertical-align: top; max-width: calc(100% + 4px); background: var(--tbg); padding: 0 2px; margin: 0 -2px; border-radius: 1px; }
  .tp .summary { position: absolute; left: 0; top: var(--summary-top); width: 100%; margin: 0; text-align: center; color: var(--tsec); font-size: calc(12px * min(var(--text-scale), 1.5)); line-height: calc(14px * min(var(--text-scale), 1.5)); overflow-wrap: anywhere; }
  .tp .summary .ink { display: inline-block; }
  .tp .locator { display: none; }
  /* 清單版:標題和小車圖、共用時間行固定在上面,只捲四輪;每輪有小車定位圖 + 會跟著字級放大的輪位名稱 */
  .tp.list .content { height: 100%; display: flex; flex-direction: column; }
  .tp.list .panel-header { display: flex; flex: none; align-items: center; gap: 8px; margin-bottom: 12px; }
  .tp.list .heading { position: static; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tp.list .car { position: static; flex: none; transform: none; width: 24px; height: 48px; }
  .tp.list .readings { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 7px; scrollbar-width: thin; scrollbar-color: var(--this) var(--tbg); }
  .tp.list .wheel { position: static; display: flex; align-items: center; gap: 12px; width: auto; min-height: 48px; margin-bottom: 12px; text-align: left; }
  .tp.list .locator { display: block; flex: none; width: 24px; height: 40px; }
  .tp.list .wheel-copy { flex: 1; min-width: 0; }
  .tp.list .position { display: block; color: var(--tsec); font-size: calc(12px * var(--text-scale)); line-height: calc(16px * var(--text-scale)); overflow-wrap: anywhere; }
  .tp.list .summary { position: static; flex: none; width: 100%; text-align: left; margin: 0 0 16px; }
  .tp.list .heading, .tp.list .summary { height: auto; }
  /* 手機上看(約 375–440 寬):畫面縮到容器寬,一個一個往下看(fitAll() 算縮放) */
  .fit { position: relative; width: 100%; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px #222b38; }
  .fit > .fit-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .alerts { margin-top: 40px; }
  .alerts > h2 { font-size: 20px; margin: 0 0 6px; }
  .alerts > p { font-size: 14px; color: #aebcd4; margin: 0 0 18px; line-height: 1.6; max-width: 120ch; }
  .alv { margin: 0 0 34px; padding: 18px; border-radius: 18px; background: #0b111d; box-shadow: 0 0 0 1px #1f2a3a; }
  .alv h3 { margin: 0 0 4px; font-size: 18px; }
  .alv > p { margin: 0 0 14px; font-size: 14px; color: #aebcd4; line-height: 1.6; max-width: 90ch; }
  .alv .shots { display: grid; grid-template-columns: minmax(0, 844px) minmax(0, 667px); gap: 16px 18px; align-items: start; }
  .alv .shot .cap { display: block; font-size: 12px; color: #8a97ae; margin: 0 0 6px; }
  @media (max-width: 1600px) { .alv .shots { grid-template-columns: minmax(0, 844px); } }
  @media (max-width: 900px) { .page { padding: 20px 16px 60px; } .bgrid { grid-template-columns: minmax(0, 1fr); } .boss { padding: 16px; } .alv { padding: 14px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- 共用 ---------- */
const MAX = 240;
const P = (cx, cy, r, a) => { const t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy - r * Math.sin(t)]; };
const f2 = (n) => n.toFixed(2);
const arcD = (cx, cy, r, a0, a1) => { const [x0, y0] = P(cx, cy, r, a0), [x1, y1] = P(cx, cy, r, a1); const sweep = a0 - a1; return `M${f2(x0)} ${f2(y0)} A${r} ${r} 0 ${Math.abs(sweep) > 180 ? 1 : 0} ${sweep > 0 ? 1 : 0} ${f2(x1)} ${f2(y1)}`; };
const isNA = (v) => v === null;
const d3 = (v) => v !== null && v >= 100;
const ic = (name, size = 24, color = "currentColor", sw = 2) => `<span class="ic" style="--s:${size}px;--sw:${sw};color:${color}"><i data-lucide="${name}"></i></span>`;
// 文字用 SVG 畫;用 canvas 量字的實際墨跡,讓數字的「墨跡中心」落在指定位置(每種字型的上下留白不同)
const _cv = document.createElement("canvas").getContext("2d");
const baseAt = (txt, font, yc) => { _cv.font = font; const m = _cv.measureText(txt); return yc + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2; };
const inkH = (txt, font) => { _cv.font = font; const m = _cv.measureText(txt); return m.actualBoundingBoxAscent + m.actualBoundingBoxDescent; };
// 第七輪:text-anchor="middle" 會把最後一個字後面的字距也算進去(字距 −10 時整串往右偏 5),x 先加回字距的一半,讓整串字寬置中
const txt = (s, x, yc, o) => { const font = `${o.w} ${o.fs}px "${o.fam}"`;
  return `<text x="${f2(x + (o.ls || 0) / 2)}" y="${f2(baseAt(s, font, yc))}" text-anchor="middle" font-family="'${o.fam}', 'Noto Sans TC'" font-weight="${o.w}" font-size="${o.fs}" fill="${o.fill}" letter-spacing="${o.ls || 0}" style="font-variant-numeric: tabular-nums">${s}</text>`; };
const NOTO = "Noto Sans TC";

/* ---------- 四個版本的主題(L37:顏色、數字字型、質感各自不同;語意色不換) ---------- */
// 語意色(各版本共用,不換):GPS 綠點 #3de0a8、GPS 搜尋 #f5b53c、電池綠、超速琥珀 #ffb638(這裡沒出現)、紅色指標 #e8344f(現在的版本和 C 用)
const TH = {
  cur: { fam: "Inter", w: 320, uw: 500, bg: "radial-gradient(120% 130% at 50% 45%, #101b2e 0%, #070b14 100%)", base: "#101b2e",
    num: "#f2f5fa", na: "#8a97ae", unit: "#8a97ae", sec: "#aebcd4", icon: "#6e7e8c", card: "#0e1a24", cardBd: "#2c5a66", cardIc: "#6fd8e2", div: "#1a2433",

    tStyle: "glass", tFilter: "none", tLight: "#6FD8E2", tBg: "#101B2E", tPri: "#F2F5FA", tSec: "#AEBCD4", tHist: "#8A97AE" },
  // L38:等寬數字、對比 ≥7:1;琥珀、橙、紅都不當常態主色(紅色只用在目前值標記)。
  // L44 / R7-01:數字字重改細(現在 Inter 320、A Jost 340、B Exo 2 320、C Barlow 400),三位數 844 寬直筆 ≥9 px、667 寬 ≥8.5 px、≥ 字高 1/12(02 §8 實量)
  // L43 / R7-04:gOn 目前檔位(= 數字色,≥7:1)、gOff 其他三個(約 4.2:1,和目前檔位的亮度比 ≥2)
  A: { fam: "Jost", w: 340, uw: 500, bg: "radial-gradient(120% 130% at 50% 45%, #171717 0%, #060606 100%)", base: "#171717",
    num: "#f7f7f5", na: "#b4b4b1", unit: "#a2a29f", sec: "#c9c9c6", icon: "#8c8c89", card: "#121212", cardBd: "#3b3b3b", cardIc: "#ededeb", div: "#262626",
    track: "#2c2c2c", fill: "#e6e6e3", mark: "#ffffff", tick: "#6a6a68", nodata: "#4a4a48", gOn: "#f7f7f5", gOff: "#7b7b79",
    tStyle: "glass", tFilter: "saturate(0) brightness(1.08)", tLight: "#D6D6D3", tBg: "#171717", tPri: "#F7F7F5", tSec: "#C9C9C6", tHist: "#A2A29F" },
  B: { fam: "Exo 2", w: 320, uw: 600, bg: "radial-gradient(rgba(130,150,255,.07) 1px, transparent 1.3px) 0 0 / 6px 6px, radial-gradient(120% 130% at 50% 45%, #10143a 0%, #060820 55%, #03040e 100%)", base: "#10143a",
    num: "#f0f3ff", na: "#b3bbe6", unit: "#a3acdc", sec: "#c7cdef", icon: "#8790c2", card: "#0e1230", cardBd: "#3f4ea8", cardIc: "#b0bcff", div: "#20265a",
    off: "#232a5c", on: "#6f88ff", head: "#e4e9ff", nodata: "#39427e", gOn: "#f0f3ff", gOff: "#7e8298",
    tStyle: "ceramic", tFilter: "none", tLight: "#B5B8FF", tBg: "#10143A", tPri: "#F0F3FF", tSec: "#C7CDEF", tHist: "#A3ACDC" },
  C: { fam: "Barlow Semi Condensed", w: 400, uw: 500, bg: "radial-gradient(120% 130% at 50% 45%, #1d1f23 0%, #0a0b0d 100%)", base: "#1d1f23",
    num: "#f5f7fa", na: "#b7bcc4", unit: "#a6acb5", sec: "#cdd2d9", icon: "#8e949c", card: "#15171a", cardBd: "#4a4f57", cardIc: "#e1e6ec", div: "#2a2d32",
    bandA: "#3a3e45", bandB: "#26292e", face: "#1a1c20", fill: "rgba(225,230,236,.30)", edge: "#e1e6ec", minor: "#60656d", major: "#c3c8cf", mark: "#e8344f", nodata: "#5a5f67", gOn: "#f5f7fa", gOff: "#83868a",
    tStyle: "ceramic", tFilter: "saturate(.12) brightness(1.05)", tLight: "#C3C8CF", tBg: "#1D1F23", tPri: "#F5F7FA", tSec: "#CDD2D9", tHist: "#A6ACB5" },
};
// 夜間最暗預設(L44、R7-01:夜間要一起量):只改顏色,字重和位置不變;數字約 8.6:1、目前檔位同數字、其他三個約 3.6:1(亮度比 2.4)、
// 單位約 4.6:1、說明約 5.2:1,量表的亮色調暗約一半;數字不加發光、外框、漸層(R7-02)。設定圖示、來源綠點、卡片不變
const NIGHT = {
  cur: { num: "#b5b8bb", na: "#798599", unit: "#798599", sec: "#838ea0", gOn: "#b5b8bb", gOff: "#6a7382", fill: "#1b949d", tip: "#63a1a7", mark: "#c32a41" },
  A: { num: "#b4b4b2", na: "#82827f", unit: "#82827f", sec: "#8b8b88", gOn: "#b4b4b2", gOff: "#70706e", fill: "#a1a19f", mark: "#b4b4b2", tick: "#535351" },
  B: { num: "#bbbec7", na: "#8088ae", unit: "#8088ae", sec: "#8d92aa", gOn: "#bbbec7", gOff: "#73778b", on: "#566ac8", head: "#a7abbc" },
  C: { num: "#c0c2c4", na: "#888d94", unit: "#888d94", sec: "#93979c", gOn: "#c0c2c4", gOff: "#777b7f", edge: "#9da1a5", major: "#8f9298", mark: "#c32a41", fill: "rgba(225,230,236,.18)" },
};
const theme = (k, night) => night ? { ...TH[k], ...NIGHT[k], night: true } : TH[k];
const OVER = "#ffb638";  // 超速琥珀(只有前方模式,v1 不開)
const themeStyle = (t) => `--bg:${t.bg};--num:${t.num};--unit:${t.unit};--sec:${t.sec};--icon:${t.icon};--card:${t.card};--cardBd:${t.cardBd};--div:${t.div}`;

// 數字的位置和字級(每個版本各自):yc = 數字墨跡中心、fs2 / fs3 = 兩位 / 三位數字級。檔位排、▲、自查都用這裡的數字
const LAYOUT = {
  // 第七輪(R7-02):數字外側 9 px 內不能有會讓數字低於 7:1 的亮圖形,所以現在的版本、B、C 的數字移到量表中心附近(現在 / B 下移 10、C 下移 8),
  // 三位數字距收緊;03 §2.2 改用「147」量字高後,844 寬三位數字級放大到 ≥105(現在 146、B 154、C 152),667 寬照舊 ≥100
  cur: (S) => { const k = S / 300; return { yc: S / 2, fs2: Math.round(158 * k), fs3: S < 300 ? 140 : 146, ls2: -5, ls3: S < 300 ? -12 : -10 }; },
  // A 沒有錶盤,數字原本離量表區上緣只有約 33,放不下檔位排:數字、單位、速度條一起往下移 A_DOWN(L43:移數字,不縮數字)
  A: (S) => { const k = S / 300; return { yc: 104 * k + A_DOWN, fs2: Math.round(196 * k), fs3: 150, ls2: -3, ls3: -4 }; },
  B: (S) => { const k = S / 300; return { yc: S / 2, fs2: Math.round(172 * k), fs3: S < 300 ? 147 : 154, ls2: -2, ls3: S < 300 ? -14 : -12 }; },
  C: (S) => { const k = S / 300; return { yc: S / 2 - 6 + C_DOWN, fs2: Math.round(176 * k), fs3: S < 300 ? 144 : 152, ls2: -1, ls3: -6 }; },
};
const A_DOWN = 6, C_DOWN = 8;
const numFont = (t, fs) => `${t.w} ${fs}px "${t.fam}"`;
// 兩位數墨跡最高點(用「0」:上下都有溢出,是兩位數裡最高的);檔位排照這個定位,所以不管幾位數、有沒有檔位排,數字都不動
const numTop2 = (t, L) => L.yc - inkH("0", numFont(t, L.fs2)) / 2;

// L43 檔位排 `P R N D`(取代 L36 的檔位方塊):數字正上方、量表區內、置中;每個字母固定一格(GEAR.cell),換檔時其他字母不動。
// R7-04 / R7-05:字母墨跡高 13(12–16);目前檔位 700 + 底線(2 粗、基線下 3、比字母墨跡寬 2),其他三個 400、gOff;
// 底線最下緣離兩位數墨跡最高點 GEAR.gap(≥12)。只在藍牙檔位新鮮時畫(gl 有值);沒資料、只有 GPS 時整排不畫
const GEARS = ["P", "R", "N", "D"], GEAR = { cap: 13, cell: 18, gap: 13, ulOff: 3, ulW: 2 };
const gearFs = (fam) => { _cv.font = `700 100px "${fam}"`; return GEAR.cap * 100 / _cv.measureText("P").actualBoundingBoxAscent; };
const gearBase = (t, L) => numTop2(t, L) - GEAR.gap - GEAR.ulOff - GEAR.ulW;
function gearRow(S, gl, t, L) {
  if (!gl) return "";
  const c = S / 2, base = gearBase(t, L), fs = gearFs(t.fam);
  let g = `<g class="gears">`;
  GEARS.forEach((ch, i) => {
    const x = c + (i - 1.5) * GEAR.cell, on = ch === gl;
    g += `<text x="${f2(x)}" y="${f2(base)}" text-anchor="middle" font-family="'${t.fam}'" font-weight="${on ? 700 : 400}" font-size="${f2(fs)}" fill="${on ? t.gOn : t.gOff}">${ch}</text>`;
    if (on) { _cv.font = `700 ${fs}px "${t.fam}"`; const m = _cv.measureText(ch), x0 = x - m.width / 2 - m.actualBoundingBoxLeft, w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      g += `<rect x="${f2(x0 - 1)}" y="${f2(base + GEAR.ulOff)}" width="${f2(w + 2)}" height="${GEAR.ulW}" fill="${t.gOn}"/>`; }
  });
  return g + `</g>`;
}
// ▲(超過點位資料速限,只有前方模式,v1 不開):第七輪改放數字正下方、原本檔位格的位置(844 (422, 318)、667 (333, 302)),24 × 20
const triY = (S) => S >= 300 ? 268 : 252;
const triMark = (S) => { const c = S / 2, y = triY(S); return `<path class="tri" d="M${c} ${y - 10} L${c + 12} ${y + 10} L${c - 12} ${y + 10} Z" fill="${OVER}"/>`; };
const svgOpen = (S) => `<svg class="abs" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" style="left:0;top:0;overflow:visible">`;
// 數字、單位(或「—」+ 原因)。o.over:前方模式超速(數字琥珀 + ▲);o.nonum:不畫數字(量筆畫時當背景)
function numText(v, S, t, L, o) {
  const fs = isNA(v) ? L.fs2 : d3(v) ? L.fs3 : L.fs2, ls = d3(v) ? L.ls3 : L.ls2;
  const s = isNA(v) ? "—" : String(v), h = inkH(isNA(v) ? "0" : s, numFont(t, fs));
  return { g: o.nonum ? "" : txt(s, S / 2, L.yc, { fam: t.fam, w: t.w, fs, fill: isNA(v) ? t.na : o.over ? OVER : t.num, ls: isNA(v) ? 0 : ls }), h };
}
// 共用的結尾:文字層(數字、單位、檔位排、▲)蓋在圖形上;o.bare 只留量表圖形(自查量檔位排和圖形的距離用)
const finish = (S, g, texts, gl, t, L, o) => g + (o.bare ? "" : texts + gearRow(S, gl, t, L) + (o.over ? triMark(S) : "")) + `</svg>`;

/* ---------- 對照:現在的版本(250° 細環 + 端點 + 紅色標記;Inter 320) ---------- */
function gCur(v, S, gl, t = TH.cur, o = {}) {
  const k = S / 300, c = S / 2, R = 146.25 * k, sw = 7.5 * k, ST = 215, SW = 250, L = LAYOUT.cur(S);
  let g = svgOpen(S) + `<path d="${arcD(c, c, R, ST, ST - SW)}" stroke="${isNA(v) ? t.nodata : t.track}" stroke-width="${sw}" fill="none" ${isNA(v) ? 'stroke-dasharray="4 8"' : ""}/>`;
  if (!isNA(v)) { const a = ST - SW * Math.min(v, MAX) / MAX;
    if (v > 0) g += `<path d="${arcD(c, c, R, ST, a)}" stroke="${t.fill}" stroke-width="${sw}" fill="none"/>`;
    // 第七輪(R7-02):紅色標記從環的內側(半徑 118–136,會碰到三位數)改成環上的一道紅色缺口,兩側各留 1.5 底色;拿掉端點圓(它也會靠近三位數)
    const [m0x, m0y] = P(c, c, R - sw / 2, a), [m1x, m1y] = P(c, c, R + sw / 2, a), seg = `x1="${f2(m0x)}" y1="${f2(m0y)}" x2="${f2(m1x)}" y2="${f2(m1y)}"`;
    g += `<line ${seg} stroke="${t.base}" stroke-width="7"/><line ${seg} stroke="${t.mark}" stroke-width="4"/>`; }
  const n = numText(v, S, t, L, o);
  let tx = n.g + (isNA(v) ? txt("車速暫不可用", c, L.yc + n.h / 2 + 24 * k, { fam: NOTO, w: 600, fs: 18, fill: t.sec, ls: 1 }) : txt("km/h", c, L.yc + n.h / 2 + 24 * k, { fam: t.fam, w: t.uw, fs: Math.round(24 * k), fill: t.unit, ls: 3 }));
  return finish(S, g, tx, gl, t, L, o);
}

/* ---------- 方向 A:直讀數字(Pure / Calm 極簡:黑白、Jost 340、沒有錶盤,只有一條細速度條) ---------- */
function gA(v, S, gl, t = TH.A, o = {}) {
  const k = S / 300, c = S / 2, L = LAYOUT.A(S);
  const n = numText(v, S, t, L, o);
  const uy = 196 * k + A_DOWN;
  let tx = n.g + (isNA(v) ? txt("車速暫不可用", c, uy, { fam: NOTO, w: 600, fs: 18, fill: t.sec, ls: 1 }) : txt("km/h", c, uy, { fam: t.fam, w: t.uw, fs: Math.round(20 * k), fill: t.unit, ls: 4 }));
  // 速度條:不放刻度數字,只在 60 / 120 / 180 留短刻度(Pure:只留必要的東西)
  const x0 = 38 * k, x1 = S - 38 * k, y = 226 * k + A_DOWN, w = x1 - x0;
  let g = svgOpen(S) + `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${isNA(v) ? t.nodata : t.track}" stroke-width="${5 * k}" stroke-linecap="round" ${isNA(v) ? 'stroke-dasharray="2 9"' : ""}/>`;
  if (!isNA(v)) [60, 120, 180].forEach(m => { const x = x0 + w * m / MAX; g += `<line x1="${f2(x)}" y1="${y + 7 * k}" x2="${f2(x)}" y2="${y + 11 * k}" stroke="${t.tick}" stroke-width="1.5"/>`; });
  if (!isNA(v)) { const xv = x0 + w * Math.min(v, MAX) / MAX;
    if (v > 0) g += `<line x1="${x0}" y1="${y}" x2="${f2(xv)}" y2="${y}" stroke="${t.fill}" stroke-width="${5 * k}" stroke-linecap="round"/>`;
    // 目前值:比速度條高的白色直條(用形狀標出,不靠顏色)
    g += `<rect x="${f2(xv - 2)}" y="${y - 12 * k}" width="4" height="${24 * k}" rx="2" fill="${t.mark}"/>`; }
  return finish(S, g, tx, gl, t, L, o);
}

/* ---------- 方向 B:點陣環(LED 點陣科技感:電光藍、Exo 2 320、短段 LED 環;不用發光模糊) ---------- */
function gB(v, S, gl, t = TH.B, o = {}) {
  // R6-01 / R6-02:內徑(段的內端含圓頭)≥ 128(280 寬)、≥ 137(300 寬),數字不被環包太緊
  // 第七輪(R7-02):燈格內端再往外 2–4(300 寬 139、280 寬 132),數字外側 9 px 內沒有亮的燈格
  const k = S / 300, c = S / 2, clear = S >= 300 ? 139 : 132, START = 240, SWEEP = 300, N = 40, L = LAYOUT.B(S);
  let g = svgOpen(S);
  const lit = isNA(v) ? -1 : Math.round(N * Math.min(v, MAX) / MAX);
  for (let i = 0; i <= N; i++) {
    // R6-06:沒資料時只畫隔段的細點(粗細一致),和 0 km/h(41 段全畫)看起來不同
    if (isNA(v) && i % 2) continue;
    const a = START - SWEEP * i / N, major = i % 10 === 0, head = !isNA(v) && i === lit;
    const sw = isNA(v) ? 3 : head ? 8 : major ? 5.5 : 4, ri = clear + sw / 2, ro = c - sw / 2 - 0.5;
    const [x0, y0] = P(c, c, ri, a), [x1, y1] = P(c, c, ro, a);
    const col = isNA(v) ? t.nodata : i < lit ? t.on : head ? t.head : t.off;
    g += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" ${isNA(v) ? 'opacity=".8"' : ""}/>`;
  }
  const n = numText(v, S, t, L, o);
  let tx = n.g + (isNA(v) ? txt("車速暫不可用", c, L.yc + n.h / 2 + 24 * k, { fam: NOTO, w: 600, fs: 18, fill: t.sec, ls: 1 }) : txt("km/h", c, L.yc + n.h / 2 + 22 * k, { fam: t.fam, w: t.uw, fs: Math.round(22 * k), fill: t.unit, ls: 2 }));
  return finish(S, g, tx, gl, t, L, o);
}

/* ---------- 方向 C:扇形(類比錶:槍灰金屬錶盤、Barlow Semi Condensed 400、刻度帶 + 外弧紅色指針;L38 不用暖色) ---------- */
function gC(v, S, gl, t = TH.C, o = {}) {
  // R6-02:數字整個放在內圈裡,不跨扇面邊界;紅針只在外弧帶裡,不穿過數字;不放刻度數字
  // 第七輪:拿掉內圈裡那一圈裝飾細線(r − 6),它就在檔位排上方,離檔位排會不到 6(R7-05)
  const k = S / 300, c = S / 2, cy = 157 * k, R = 148 * k, r = 118 * k, L = LAYOUT.C(S);
  let g = svgOpen(S) + `<defs><linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.bandA}"/><stop offset="1" stop-color="${t.bandB}"/></linearGradient>` +
    `<radialGradient id="faceC" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#22252a"/><stop offset="1" stop-color="${t.face}"/></radialGradient></defs>`;
  const half = `M${c - R} ${cy} A${R} ${R} 0 0 1 ${c + R} ${cy} L${c + r} ${cy} A${r} ${r} 0 0 0 ${c - r} ${cy} Z`;
  if (isNA(v)) g += `<path d="${half}" fill="none" stroke="${t.nodata}" stroke-width="2" stroke-dasharray="5 8"/>`;
  else { // 錶面:內圈淡淡的金屬底(o.bare 時不畫:它是錶面底色,不是量表圖形),外圈是刻度帶
    if (!o.bare) g += `<path d="M${c - r} ${cy} A${r} ${r} 0 0 1 ${c + r} ${cy} Z" fill="url(#faceC)"/>`;
    g += `<path d="${half}" fill="url(#bandC)"/>`; }
  // 第七輪(R7-02):銀色填色和紅針從內圈往外 10 才開始(rf),內圈外留一圈深色,數字外側 9 px 內沒有亮的填色和紅針
  const rf = r + 10 * k;
  if (!isNA(v) && v > 0) { const a = 180 - 180 * Math.min(v, MAX) / MAX, [ox, oy] = P(c, cy, R, a), [ix, iy] = P(c, cy, rf, a);
    g += `<path d="M${c - R} ${cy} A${R} ${R} 0 0 1 ${f2(ox)} ${f2(oy)} L${f2(ix)} ${f2(iy)} A${rf} ${rf} 0 0 0 ${c - rf} ${cy} Z" fill="${t.fill}"/>`;
    g += `<path d="${arcD(c, cy, R - 2 * k, 180, a)}" stroke="${t.edge}" stroke-width="${4 * k}" fill="none"/>`; }
  if (!isNA(v)) {
    // 刻度帶:每 10 一小格、每 40 一大格
    for (let m = 0; m <= MAX; m += 10) { const a = 180 - 180 * m / MAX, big = m % 40 === 0, [x0, y0] = P(c, cy, R - 5 * k, a), [x1, y1] = P(c, cy, R - (big ? 17 : 11) * k, a);
      g += `<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${big ? t.major : t.minor}" stroke-width="${big ? 2.5 : 1.5}"/>`; }
    const a = 180 - 180 * Math.min(v, MAX) / MAX, [n0x, n0y] = P(c, cy, rf + 2 * k, a), [n1x, n1y] = P(c, cy, R - 4 * k, a);  // 外端收進 R − 4,深色描邊的圓頭在 0 和 240 時也不超出量表區
    // 紅針下墊一圈深色描邊:紅色和銀色填色亮度接近(1.2–1.5:1),靠描邊分開(描邊對填色約 3.9:1)
    g += `<line x1="${f2(n0x)}" y1="${f2(n0y)}" x2="${f2(n1x)}" y2="${f2(n1y)}" stroke="#0d0e10" stroke-width="${5 * k + 4}" stroke-linecap="round"/>`;
    g += `<line x1="${f2(n0x)}" y1="${f2(n0y)}" x2="${f2(n1x)}" y2="${f2(n1y)}" stroke="${t.mark}" stroke-width="${5 * k}" stroke-linecap="round"/>`; }
  const n = numText(v, S, t, L, o);  // R6-06:數字中心比 01 低 4,三位數字高 ≥105 / ≥100(L39)
  let tx = n.g + (isNA(v) ? txt("車速暫不可用", c, L.yc + n.h / 2 + 24 * k, { fam: NOTO, w: 600, fs: 18, fill: t.sec, ls: 1 }) : txt("km/h", c, L.yc + n.h / 2 + 22 * k, { fam: t.fam, w: t.uw, fs: Math.round(23 * k), fill: t.unit, ls: 2 }));
  return finish(S, g, tx, gl, t, L, o);
