<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Landscape Mockups</title>
<!-- visual 橫式主要設計稿(00-rulings L28:app 只做橫式;L29:拿掉鏡像)。幾何和顏色沿用 stage2-mockups.html。
     單一畫面:?screen=<ID>(給 headless Chrome 匯出 PNG);不帶參數:全部畫面 + 說明。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=block" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    /* DESIGN.md 既有 token */
    --bg-base: #0a101c;
    --surface-raised: #16202e;
    --divider: #1a2433;
    --text-primary: #f2f5fa;
    --text-secondary: #aebcd4;
    --text-row: #d6deea;
    --unit: #8a97ae;
    --text-tertiary: #6e7e8c;
    --text-dim: #5a6675;
    --tick-minor: #44526a;
    --accent: #2bd4e0;
    --accent-bright: #8fe6ee;
    --accent-text: #6fd8e2;
    --accent-dim: #3c7a82;
    --seg-active: #1e3c45;
    --needle: #e8344f;
    --gps-fix: #3de0a8;
    --gps-search: #f5b53c;
    --over: #ffb638;
    --batt-fill-a: #2bbf86;
    --batt-fill-b: #3de0a8;
    /* 從 .pen 收進來的 hex(02 §3 建議成為 token) */
    --gauge-track: #1e2a40;
    --pill-bg: #0e1a24;
    --pill-border: #2c5a66;
    /* 02 §3 新增候選 */
    --speed-unavailable: #8a97ae;
    --chrome-icon: #6e7e8c;
    --over-card-bg: #2a1f0a;
    --border-control: #243042;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #05080e;
    color: var(--text-primary);
    font-family: "Inter", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .ic { display: inline-flex; align-items: center; justify-content: center; color: currentColor; }
  .ic svg { width: var(--s, 24px); height: var(--s, 24px); stroke-width: var(--sw, 2); }

  /* gallery */
  .page { padding: 40px 32px 80px; max-width: 1800px; margin: 0 auto; }
  .page h1 { font-size: 22px; margin: 0 0 6px; }
  .page p.lead { margin: 0 0 28px; color: var(--text-secondary); font-size: 14px; line-height: 1.6; max-width: 90ch; }
  .group { margin-top: 36px; }
  .group h2 { font-size: 16px; color: var(--text-secondary); margin: 0 0 18px; font-weight: 600; letter-spacing: .3px; }
  .row { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 12px; width: 390px; }
  .item.wide { width: 844px; }
  .item .cap b { display: block; font-size: 13px; color: var(--text-row); }
  .item .cap span { display: block; font-size: 12px; color: var(--unit); line-height: 1.5; margin-top: 3px; }
  .item .frame { border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 6px #11161f, 0 0 0 7px #222b38; }

  /* screen */
  .screen {
    position: relative; width: 390px; height: 844px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #101b2e 0%, #070b14 100%);
  }
  .screen.page-bg { background: radial-gradient(130% 90% at 50% 20%, #101b2e 0%, #070b14 100%); }
  .abs { position: absolute; }

  /* source chip:形狀 + 文字，不只靠顏色 */
  .chip { position: absolute; left: 24px; top: 38px; height: 24px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chip .lbl { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--text-secondary); }
  .mk { width: 12px; height: 12px; flex: none; }
  .mk.ok { border-radius: 50%; background: var(--gps-fix); }
  .mk.half { border-radius: 50%; border: 2px solid var(--gps-search); background: linear-gradient(90deg, var(--gps-search) 50%, transparent 50%); }
  .mk.wait { border-radius: 50%; border: 2px dashed var(--unit); }
  .mk.tri { width: 14px; height: 12px; background: var(--gps-search); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .gear { position: absolute; right: 12px; top: 24px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--chrome-icon); }

  /* gauge readout(.pen D2:center frame 300×300 at 45,190) */
  .readout { position: absolute; left: 45px; top: 190px; width: 300px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .speed { font-size: 158px; font-weight: 700; letter-spacing: -5px; color: var(--text-primary); line-height: 1.21; }
  .speed.over { color: var(--over); }
  .speed.na { color: var(--speed-unavailable); letter-spacing: 0; }
  .unit { font-size: 24px; font-weight: 500; letter-spacing: 3px; color: var(--unit); }
  .over-mark { position: absolute; left: 0; right: 0; top: 214px; display: flex; justify-content: center; color: var(--over); }

  /* 觸發區:平常保留位置但不畫東西 */
  .trigger { position: absolute; left: 0; right: 0; top: 522px; display: flex; justify-content: center; }
  .tcard { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 16px; background: var(--pill-bg); border: 1px solid var(--pill-border); white-space: nowrap; }
  .tcard .t-lbl { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
  .tcard .t-num { font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -.5px; }
  .tcard .t-sep { font-size: 18px; color: var(--text-tertiary); }
  .tcard .t-dist { font-size: 22px; font-weight: 600; color: var(--text-primary); }
  .tcard.over { background: var(--over-card-bg); border: 2px solid var(--over); }
  .tcard.over .t-lbl { color: var(--over); font-weight: 700; font-size: 16px; }

  /* 狀態列:目前檔位 + 電量 · 續航 */
  .status { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 14px; white-space: nowrap; }
  .gearbox { width: 32px; height: 32px; border-radius: 8px; background: var(--pill-bg); border: 1px solid var(--pill-border); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: var(--text-primary); }
  .vsep { width: 1px; height: 20px; background: var(--tick-minor); }
  .batt { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; color: var(--text-secondary); letter-spacing: .3px; }
  .bcap { display: flex; align-items: center; }
  .bcap .body { width: 32px; height: 14px; border-radius: 3px; background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-control); overflow: hidden; }
  .bcap .fill { height: 100%; background: linear-gradient(90deg, var(--batt-fill-a), var(--batt-fill-b)); }
  .bcap .nub { width: 3px; height: 7px; border-radius: 0 2px 2px 0; background: #2f3e52; }

  /* parked */
  .trip { position: absolute; left: 24px; right: 24px; top: 516px; display: flex; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
  .trip .cell { flex: 1; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .trip .cell + .cell { border-left: 1px solid var(--divider); }
  .trip .k { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--unit); }
  .trip .v { font-size: 18px; font-weight: 600; color: var(--text-row); }
  .trip .v small { font-size: 12px; font-weight: 500; color: var(--unit); margin-left: 3px; }
  .note { font-size: 12px; color: var(--unit); line-height: 1.5; }
  .tire { position: absolute; left: 24px; right: 24px; top: 612px; }
  .tire .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .tire .hd b { font-size: 15px; font-weight: 600; color: var(--text-row); }
  .tire .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tire .w { background: rgba(22, 32, 46, .6); border: 1px solid var(--divider); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .tire .w .pos { font-size: 12px; font-weight: 600; color: var(--unit); }
  .tire .w .val { font-size: 19px; font-weight: 600; color: var(--text-primary); }
  .tire .w .val small { font-size: 12px; color: var(--unit); margin-left: 3px; font-weight: 500; }
  .tire .w .ts { font-size: 12px; color: var(--unit); }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); top: 96px; padding: 6px 16px; border-radius: 16px; background: var(--pill-bg); border: 1px solid var(--pill-border); color: var(--accent-text); font-size: 13px; font-weight: 500; letter-spacing: 1px; white-space: nowrap; }
  .placeholder { position: absolute; left: 24px; right: 24px; top: 470px; border: 1px dashed var(--text-dim); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .placeholder span { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }

  /* 一般頁面 */
  .pg { position: absolute; inset: 0; padding: 56px 24px 32px; display: flex; flex-direction: column; }
  .hdr { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 12px; color: var(--text-secondary); }
  .hdr .title { font-size: 24px; font-weight: 700; color: var(--text-primary); }
  h3.big { font-size: 24px; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
  .body { font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin: 0; }
  .small { font-size: 13px; line-height: 1.6; color: var(--text-secondary); margin: 0; }
  .btn { height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; width: 100%; }
  .btn.pri { background: var(--accent); color: var(--bg-base); }
  .btn.sec { border: 1.5px solid var(--pill-border); color: var(--text-row); font-weight: 600; }
  .btn.txt { height: 48px; color: var(--accent-text); font-size: 15px; font-weight: 600; }
  .link { color: var(--accent-text); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; min-height: 48px; }
  .spacer { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* S01 */
  .optcard { position: relative; display: flex; gap: 14px; padding: 12px; border-radius: 16px; background: rgba(22, 32, 46, .55); border: 1.5px solid var(--divider); }
  .optcard.sel { border: 2px solid var(--accent); background: rgba(30, 60, 69, .35); }
  .optcard .txt { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; flex: 1; }
  .optcard .name { font-size: 17px; font-weight: 700; }
  .optcard .desc { font-size: 13.5px; line-height: 1.55; color: var(--text-secondary); }
  .optcard .tick { position: absolute; right: 12px; top: 12px; }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-tertiary); }
  .mini { position: relative; width: 92px; height: 164px; flex: none; border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #101b2e 0%, #070b14 100%); box-shadow: inset 0 0 0 1px var(--border-control); }
  .mini .demo { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-secondary); border: 1px solid var(--border-control); border-radius: 8px; padding: 1px 7px; white-space: nowrap; }
  .mini .num { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .mini .u { position: absolute; left: 0; right: 0; top: 98px; text-align: center; font-size: 9px; color: var(--unit); letter-spacing: 1px; }
  .mini .ph { position: absolute; left: 8px; right: 8px; bottom: 10px; border: 1px dashed var(--text-tertiary); border-radius: 6px; padding: 3px 2px; font-size: 9px; line-height: 1.3; text-align: center; color: var(--text-secondary); }
  .mini .chipm { position: absolute; left: 8px; top: 28px; display: flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; color: var(--text-secondary); }
  .mini .chipm i { width: 6px; height: 6px; border-radius: 50%; background: var(--gps-fix); display: block; }

  /* S16 */
  .steps { display: flex; gap: 6px; margin: 4px 0 8px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--gauge-track); display: block; }
  .steps i.on { background: var(--accent); }
  .stepl { font-size: 13px; font-weight: 600; color: var(--unit); letter-spacing: .5px; }
  .waiting { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; color: var(--text-row); min-height: 44px; }

  /* S12 / S22 / S08 list */
  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--divider); font-size: 16px; color: var(--text-row); }
  .li .ic { color: var(--text-tertiary); }
  .card { border-radius: 16px; background: rgba(22, 32, 46, .55); border: 1px solid var(--divider); padding: 16px; }

  /* settings */
  .grp { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--unit); margin: 22px 0 2px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--divider); }
  .srow .l { display: flex; flex-direction: column; gap: 3px; }
  .srow .l b { font-size: 17px; font-weight: 500; color: var(--text-row); }
  .srow .l span { font-size: 12.5px; color: var(--unit); }
  .srow .v { display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--text-secondary); white-space: nowrap; }
  .srow .v .ic { color: var(--text-tertiary); }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--surface-raised); }
  .seg span { padding: 0 12px; min-height: 42px; display: flex; align-items: center; border-radius: 9px; font-size: 14px; font-weight: 600; color: #8f9cb0; white-space: nowrap; }
  .seg span.on { background: var(--seg-active); color: var(--accent-text); }
  .tg { width: 50px; height: 30px; border-radius: 15px; padding: 3px; display: flex; flex: none; }
  .tg.on { background: var(--accent); justify-content: flex-end; }
  .tg.off { background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-control); justify-content: flex-start; }
  .tg i { width: 24px; height: 24px; border-radius: 50%; display: block; }
  .tg.on i { background: var(--bg-base); }
  .tg.off i { background: var(--text-secondary); }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .dots span i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .dots span.on i { outline: 2px solid var(--accent); outline-offset: 4px; }
  .okdot { width: 10px; height: 10px; border-radius: 50%; background: var(--gps-fix); display: inline-block; margin-right: 4px; }
  /* ---------- 第三階段(第二批) ---------- */
  .sub2 { position: absolute; left: 24px; top: 66px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  .agel { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--text-secondary); }
  /* L21:舊值不靠變暗,用 ≥4.5:1 的歷史色 + 自己的時間 */
  .dimv .batt, .tire .val.dimv, .tire .val.dimv small, .tiles b.dimv { color: #8a97ae !important; }
  .dimv .bcap .fill { background: #4c586d !important; }
  .tcard2 { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-radius: 16px; background: var(--pill-bg); border: 1px solid var(--pill-border); white-space: nowrap; }
  .tcard2 .l1 { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
  .tcard2 .l2 { display: flex; align-items: baseline; gap: 8px; }
  .tcard2 .l2 .k { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
  .tcard2 .l2 .n { font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -.5px; }
  .tcard2 .l2 .u { font-size: 15px; font-weight: 600; color: var(--unit); }
  .scrim { position: absolute; inset: 0; background: rgba(5, 8, 14, .74); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #121c2b; border-radius: 24px 24px 0 0; box-shadow: 0 -1px 0 var(--border-control); padding: 12px 24px 34px; display: flex; flex-direction: column; gap: 12px; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #2f3e52; align-self: center; margin-bottom: 6px; }
  .sheet h4 { margin: 0; font-size: 22px; font-weight: 700; }
  .field { height: 56px; border-radius: 14px; background: var(--surface-raised); border: 1.5px solid var(--border-control); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 19px; font-weight: 600; letter-spacing: 1.5px; }
  .field.err { border: 2px solid var(--over); }
  .field small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--unit); }
  .errmsg { display: flex; align-items: center; gap: 6px; color: var(--over); font-size: 14px; font-weight: 600; margin-top: 8px; }
  .btn.dis { background: var(--surface-raised); color: #8f9cb0; }
  .btn.danger { color: #ff8a9b; border: 1.5px solid #6a2c39; font-weight: 600; }
  .btn.dangertxt { height: 48px; color: #ff8a9b; font-size: 15px; font-weight: 600; }
  .chk { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; font-size: 15px; line-height: 1.5; color: var(--text-row); }
  .chk .ic { margin-top: 2px; flex: none; }
  .sect { font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--unit); margin: 18px 0 4px; }
  .kv { display: flex; flex-direction: column; gap: 3px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .kv b { font-size: 15px; font-weight: 600; color: var(--text-row); }
  .kv span { font-size: 13.5px; line-height: 1.55; color: var(--text-secondary); }
  .pstep { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; font-weight: 600; color: var(--text-row); }
  .pstep.todo { color: var(--unit); font-weight: 500; }
  .stepn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--text-tertiary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-secondary); flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-control); color: var(--text-secondary); }
  .toast { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 14px; background: #121c2b; border: 1px solid var(--border-control); font-size: 15px; line-height: 1.45; color: var(--text-row); }
  .toast .ic { flex: none; }
  .toast small { display: block; font-size: 12px; color: var(--unit); margin-top: 2px; }
  .hero { width: 64px; height: 64px; border-radius: 20px; background: rgba(30, 60, 69, .55); display: flex; align-items: center; justify-content: center; color: var(--accent-text); margin-bottom: 18px; }
  .hero.warn { background: var(--over-card-bg); color: var(--over); }
  .vals { display: flex; }
  .vals > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
  .vals > div + div { border-left: 1px solid var(--divider); }
  .vals .k { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--unit); }
  .vals .v { font-size: 24px; font-weight: 700; }
  .vals .v small { font-size: 13px; color: var(--unit); font-weight: 500; margin-left: 3px; }
  .mini .mcard { position: absolute; left: 14px; right: 14px; top: 116px; height: 14px; border-radius: 5px; background: var(--pill-bg); border: 1px solid var(--pill-border); display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 7px; color: var(--text-secondary); }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--divider); }
  .row2 .l { display: flex; flex-direction: column; gap: 3px; }
  .row2 .l b { font-size: 16px; font-weight: 500; color: var(--text-row); }
  .row2 .l span { font-size: 12.5px; color: var(--unit); line-height: 1.45; }
  .row2.off .l b { color: #8f9cb0; }
  .placeholder .link, .badge { white-space: nowrap; flex: none; }
  /* ---------- 第四階段 ---------- */
  .unit.na { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: var(--text-secondary); }
  .speed.pgear { font-size: 110px; letter-spacing: 0; }
  .tcard2 .l1 .d { font-size: 22px; font-weight: 600; color: var(--text-primary); margin-left: 8px; }
  .tcard .t-u { font-size: 15px; font-weight: 600; color: var(--text-secondary); }

/* ---------- 量表幾何(照 .pen D2:圓心 195,340；外徑 150、innerRadius 0.95；起點 215°，掃 -250°；滿刻度 240) ---------- */
const CX = 195, CY = 340, R = 146.25, SW = 7.5, START = 215, SWEEP = 250, MAX = 240;
const pt = (a, r, cx = CX, cy = CY) => { const t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy - r * Math.sin(t)]; };
const arc = (a0, a1, r, cx = CX, cy = CY) => { const [x0, y0] = pt(a0, r, cx, cy), [x1, y1] = pt(a1, r, cx, cy); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a0 - a1) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
const ic = (name, size = 24, color = "currentColor", sw = 2) => `<span class="ic" style="--s:${size}px;--sw:${sw};color:${color}"><i data-lucide="${name}"></i></span>`;

function gauge(v, o = {}) {
  // v = null → 無有效車速:只留 track,active 弧、端點、紅色標記都拿掉(不淡化舊值)。o:{cx, cy, w, h} 給橫式用
  const cx = o.cx || CX, cy = o.cy || CY;
  let s = `<svg class="abs" width="${o.w || 390}" height="${o.h || 844}" style="left:0;top:0"><path d="${arc(START, START - SWEEP, R, cx, cy)}" stroke="var(--gauge-track)" stroke-width="${SW}" fill="none"/>`;
  if (v !== null) {
    const a = START - SWEEP * Math.min(v, MAX) / MAX;
    if (v > 0) s += `<path d="${arc(START, a, R, cx, cy)}" stroke="var(--accent)" stroke-width="${SW}" fill="none"/>`;
    const [tx, ty] = pt(a, R, cx, cy), [m0x, m0y] = pt(a, 118, cx, cy), [m1x, m1y] = pt(a, 136, cx, cy);
    if (v > 0) s += `<circle cx="${tx}" cy="${ty}" r="7" fill="var(--accent-bright)"/>`;
