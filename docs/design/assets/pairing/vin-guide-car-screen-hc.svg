<rect x="176" y="136" width="104" height="5" rx="2.5" fill="#3A3E45"/>
<!-- bottom bar -->
<path d="M9 166 H311 V182 A11 11 0 0 1 300 193 H20 A11 11 0 0 1 9 182 Z" fill="#0A0B0D"/>
<line x1="9" y1="166" x2="311" y2="166" stroke="#3A3E45" stroke-width="1.5"/>
<path d="M23.5 185 V181.5 Q23.5 179.5 25.5 179 L28 174.5 Q28.8 173 30.5 173 H37.5 Q39.2 173 40 174.5 L42.5 179 Q44.5 179.5 44.5 181.5 V185 Z" fill="#EEF1F4"/>
<rect x="25.5" y="185" width="4" height="3" rx="1" fill="#EEF1F4"/>
<rect x="38.5" y="185" width="4" height="3" rx="1" fill="#EEF1F4"/>
<rect x="62" y="175" width="44" height="12" rx="6" fill="none" stroke="#6B7078" stroke-width="1.5"/>
<rect x="138" y="176" width="10" height="10" rx="2.5" fill="#6B7078"/>
<rect x="155" y="176" width="10" height="10" rx="2.5" fill="#6B7078"/>
<rect x="172" y="176" width="10" height="10" rx="2.5" fill="#6B7078"/>
<rect x="258" y="175" width="40" height="12" rx="6" fill="none" stroke="#6B7078" stroke-width="1.5"/>
<!-- screen frame on top -->
<rect x="8" y="6" width="304" height="188" rx="12" fill="none" stroke="#B8BDC4" stroke-width="2"/>
<!-- hotspot 1: Controls (car icon, bottom left) -->
<circle cx="34" cy="180" r="12.5" fill="none" stroke="#2BD4E0" stroke-width="2"/>
<g transform="translate(52 161)"><circle r="11" fill="#2BD4E0" stroke="#0A0B0D" stroke-width="2.5"/><path d="M-2.4 -3.4 L0.9 -5.6 V5.6" fill="none" stroke="#0A0B0D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- hotspot 2: Software row -->
<g transform="translate(166 123)"><circle r="11" fill="#2BD4E0" stroke="#0A0B0D" stroke-width="2.5"/><path d="M-3.5 -2.6 C-3.5 -4.9 -1.8 -5.7 0 -5.7 C2 -5.7 3.5 -4.5 3.5 -2.6 C3.5 -0.2 0.8 1.4 -3.6 5.6 H3.8" fill="none" stroke="#0A0B0D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
