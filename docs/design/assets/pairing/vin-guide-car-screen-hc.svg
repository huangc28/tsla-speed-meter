<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
<!--
  vin-guide-car-screen-hc.svg (hc)
  Where the VIN is: car touchscreen, (1) Controls car icon bottom left, (2) Software in the menu; VIN line highlighted under the car name and model.
  320 x 200 pt artwork for SwiftUI. No text, fonts or raster images: labels are native text
  next to the art (docs/design/frames/pairing-art.html). Digits 1 and 2 are drawn as strokes.
  Normal sibling: same file name without -hc. Only the neutral tokens differ; cyan is unchanged.
  Cyan (accent*) marks only what to act on: hotspots 1-2, the Software row, the VIN line.
  Colours (DESIGN.md tokens, high-contrast values):
  bg.base              #0A0B0D
  card                 #15171A
  panel                #1A1C20
  surface.raised       #24272C
  divider              #3A3E45
  card.border          #6B7078
  text.tertiary        #B8BDC4
  unit                 #D0D4DA
  text.secondary       #EEF1F4
  accent               #2BD4E0
  accent.text          #6FD8E2
  accent.segActiveBg   #1E3C45
-->
<!-- car touchscreen -->
<rect x="8" y="6" width="304" height="188" rx="12" fill="#15171A"/>
<!-- left: car status area with a generic car -->
<g transform="translate(18 92) scale(0.94)"><path d="M0 21 V14 Q0 10 5 9 L18 7 L28 1 Q31 -1 36 -1 H50 Q55 -1 58 2 L64 7 Q68 8 68 12 V21 Z" fill="#24272C" stroke="#6B7078" stroke-width="1.60" stroke-linejoin="round"/><path d="M24 8 L31 2.5 H48 L54 8 Z" fill="#15171A"/><circle cx="13" cy="21" r="5" fill="#0A0B0D" stroke="#6B7078" stroke-width="1.60"/><circle cx="55" cy="21" r="5" fill="#0A0B0D" stroke="#6B7078" stroke-width="1.60"/></g>
<rect x="18" y="128" width="64" height="5" rx="2.5" fill="#6B7078"/>
<!-- Controls panel, open over the map -->
<rect x="102" y="14" width="202" height="144" rx="8" fill="#1A1C20" stroke="#6B7078" stroke-width="1.5"/>
<rect x="113" y="24" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="25" width="30" height="4" rx="2" fill="#6B7078"/>
<rect x="113" y="40" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="41" width="24" height="4" rx="2" fill="#6B7078"/>
<rect x="113" y="56" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="57" width="28" height="4" rx="2" fill="#6B7078"/>
<rect x="113" y="72" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="73" width="22" height="4" rx="2" fill="#6B7078"/>
<rect x="113" y="88" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="89" width="32" height="4" rx="2" fill="#6B7078"/>
<rect x="113" y="104" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="105" width="26" height="4" rx="2" fill="#6B7078"/>
<rect x="107" y="115" width="52" height="16" rx="5" fill="#1E3C45" stroke="#6FD8E2" stroke-width="1.5"/>
<rect x="113" y="120" width="6" height="6" rx="1.5" fill="#6FD8E2"/>
<rect x="123" y="121" width="25" height="4" rx="2" fill="#6FD8E2"/>
<rect x="113" y="136" width="6" height="6" rx="1.5" fill="#6B7078"/>
<rect x="123" y="137" width="30" height="4" rx="2" fill="#6B7078"/>
<line x1="164" y1="22" x2="164" y2="150" stroke="#3A3E45" stroke-width="1.5"/>
<!-- Software page: car image, name, model, VIN line -->
<g transform="translate(200 27) scale(1.2)"><path d="M0 21 V14 Q0 10 5 9 L18 7 L28 1 Q31 -1 36 -1 H50 Q55 -1 58 2 L64 7 Q68 8 68 12 V21 Z" fill="#24272C" stroke="#B8BDC4" stroke-width="1.25" stroke-linejoin="round"/><path d="M24 8 L31 2.5 H48 L54 8 Z" fill="#15171A"/><circle cx="13" cy="21" r="5" fill="#0A0B0D" stroke="#B8BDC4" stroke-width="1.25"/><circle cx="55" cy="21" r="5" fill="#0A0B0D" stroke="#B8BDC4" stroke-width="1.25"/></g>
<rect x="176" y="68" width="58" height="7" rx="3.5" fill="#EEF1F4"/>
<rect x="176" y="81" width="86" height="5" rx="2.5" fill="#D0D4DA"/>
<rect x="171" y="93" width="127" height="19" rx="5" fill="#1E3C45" stroke="#6FD8E2" stroke-width="2"/>
